<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">A quiet study desk</title>
  <desc id="desc">A laptop, notebook, coffee and leafy plant arranged on a warm terracotta desk.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#e8e4d4"/><stop offset="1" stop-color="#f2eee2"/></linearGradient>
    <linearGradient id="desk" x2="1" y2=".15"><stop stop-color="#d38b67"/><stop offset="1" stop-color="#bd7054"/></linearGradient>
    <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#44594a"/><stop offset="1" stop-color="#27372f"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>
  <rect width="960" height="600" fill="url(#wall)"/>
